name: ⚡ Intraday Rank Update

on:
  # KST = UTC+9
  # 09:20 KST = 00:20 UTC
  # 11:00 KST = 02:00 UTC
  # 13:00 KST = 04:00 UTC
  # 15:00 KST = 06:00 UTC
  schedule:
    - cron: '20 0 * * 1-5'   # 09:20 KST — 전날 종가 대비
    - cron: '0  2 * * 1-5'   # 11:00 KST — 09:20 대비
    - cron: '0  4 * * 1-5'   # 13:00 KST — 11:00 대비
    - cron: '0  6 * * 1-5'   # 15:00 KST — 13:00 대비

  # 수동 실행 (테스트용)
  workflow_dispatch:
    inputs:
      label:
        description: '실행 라벨 (0920 / 1100 / 1300 / 1500) — 비워두면 현재 KST 시각 자동 판단'
        required: false
        default: ''

jobs:
  intraday-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── cron schedule → label 매핑 ─────────────────────────────────────────
      # github.event.schedule 은 실제로 트리거한 cron 문자열을 반환합니다.
      # 이를 통해 GitHub Actions 실행 지연 여부와 무관하게 올바른 라벨을 지정합니다.
      - name: Resolve label
        id: resolve
        run: |
          MANUAL="${{ github.event.inputs.label }}"
          if [ -n "$MANUAL" ]; then
            echo "label=$MANUAL" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "20 0 * * 1-5")  echo "label=0920" >> $GITHUB_OUTPUT ;;
              "0  2 * * 1-5")  echo "label=1100" >> $GITHUB_OUTPUT ;;
              "0  4 * * 1-5")  echo "label=1300" >> $GITHUB_OUTPUT ;;
              "0  6 * * 1-5")  echo "label=1500" >> $GITHUB_OUTPUT ;;
              *)               echo "label="     >> $GITHUB_OUTPUT ;;
            esac
          fi
          echo "✅ 결정된 라벨: $(grep label $GITHUB_OUTPUT | cut -d= -f2)"

      - name: Run intraday update
        run: |
          LABEL="${{ steps.resolve.outputs.label }}"
          if [ -n "$LABEL" ]; then
            echo "▶ python run_hourly.py --label $LABEL"
            python run_hourly.py --label "$LABEL"
          else
            echo "▶ python run_hourly.py (시각 자동 판단)"
            python run_hourly.py
          fi

      - name: Commit and push
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/kospi/ data/kosdaq/ data/intraday/ index.html || true
          [ -f data/name_cache.json ] && git add data/name_cache.json 2>/dev/null || true
          git diff --staged --quiet && echo "변경사항 없음" && exit 0
          git commit -m "⚡ Intraday: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
          git stash 2>/dev/null || true   # 남은 unstaged 변경사항 제거 → pull --rebase 충돌 방지
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "⚠ Push 실패 (시도 $i/3) — 10초 후 재시도..."
            sleep 10
          done
