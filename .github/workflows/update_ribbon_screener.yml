name: 📡 Ribbon Screener

on:
  # 평일 KST 09:00 (UTC 00:00) — 한국·미국 장 마감 후
  schedule:
    - cron: '0 0 * * 2-6'

  # 수동 실행
  workflow_dispatch:

jobs:
  ribbon-screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Ribbon Screener
        run: python run_ribbon_screener.py

      - name: Regenerate index.html
        run: python scripts/regen_html.py

      - name: Commit and push results
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name  "github-actions[bot]"
          git add data/ribbon_screener.json data/charts/ index.html 2>/dev/null || true
          git diff --staged --quiet && echo "변경사항 없음 — 커밋 스킵" && exit 0
          git commit -m "📡 Ribbon Screener: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 10
          done
