<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📈 글로벌 시총 순위 상승 트래커</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
      background: #f0f2f5; color: #1a1a2e; min-height: 100vh;
    }

    /* ── 헤더 ── */
    header {
      background: linear-gradient(135deg, #0d47a1 0%, #1976d2 100%);
      color: #fff; padding: 24px 32px 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
    }
    header h1 { font-size: 21px; font-weight: 800; }
    header .meta { margin-top: 5px; font-size: 12px; opacity: .78;
                   display: flex; flex-wrap: wrap; gap: 16px; }

    /* ── 레이아웃 ── */
    .container { max-width: 860px; margin: 0 auto; padding: 22px 16px 48px; }

    /* ── 탭 공통 ── */
    .tab-bar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .tab-btn {
      padding: 7px 18px; border: 2px solid transparent; border-radius: 20px;
      cursor: pointer; font-size: 13px; font-weight: 700;
      background: #fff; color: #555;
      transition: all .18s; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .tab-btn:hover { border-color: #90caf9; }

    /* 그룹 탭 */
    .group-tabs { margin-bottom: 16px; }
    .group-tabs .tab-btn.active { background: #1a237e; color: #fff; border-color: #1a237e; }

    /* 마켓 탭 */
    .market-tabs .tab-btn.active { background: #0d47a1; color: #fff; border-color: #0d47a1; }

    /* 기간 탭 */
    .period-tabs .tab-btn.active          { background: #2e7d32; color: #fff; border-color: #2e7d32; }
    .period-tabs .tab-btn.intraday.active { background: #e65100; color: #fff; border-color: #e65100; }
    .period-tabs .tab-btn.intraday        { color: #e65100; border-color: #ffe0cc; }
    .period-tabs .tab-btn.streak.active   { background: #f57f17; color: #fff; border-color: #f57f17; }
    .period-tabs .tab-btn.streak          { color: #f57f17; border-color: #ffe0b2; }
    .period-tabs .tab-btn.summary-period.active { background: #1565c0; color: #fff; border-color: #1565c0; }
    .period-tabs .tab-btn.summary-period  { color: #1565c0; border-color: #bbdefb; }
    .period-tabs .tab-btn.manage-period.active  { background: #6a1b9a; color: #fff; border-color: #6a1b9a; }
    .period-tabs .tab-btn.manage-period   { color: #6a1b9a; border-color: #e1bee7; }

    /* ── 장중 배너 ── */
    .intraday-banner {
      background: #fff3e0; border-left: 4px solid #e65100;
      border-radius: 0 8px 8px 0; padding: 10px 16px;
      margin-bottom: 14px; font-size: 13px; color: #bf360c;
      display: flex; align-items: center; gap: 8px;
    }
    .intraday-banner .time-badge {
      background: #e65100; color: #fff; padding: 2px 10px;
      border-radius: 10px; font-weight: 800; font-size: 13px;
    }

    /* ── 로딩 스피너 ── */
    .loading-wrap {
      text-align: center; padding: 60px 20px;
      background: #fff; border-radius: 14px;
      box-shadow: 0 1px 5px rgba(0,0,0,.07);
    }
    .spinner {
      width: 40px; height: 40px; margin: 0 auto 16px;
      border: 4px solid #e3f2fd;
      border-top-color: #1976d2;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-wrap p { color: #999; font-size: 14px; }

    /* ── 섹션 헤더 ── */
    .section-header {
      display: flex; align-items: center; flex-wrap: wrap;
      justify-content: space-between; gap: 8px; margin: 4px 0 12px;
    }
    .section-header h2 { font-size: 14px; font-weight: 700; color: #333; }
    .compare-label {
      font-size: 12px; color: #999; background: #e8f5e9;
      padding: 3px 10px; border-radius: 10px;
    }
    .compare-label.orange { background: #fff3e0; color: #bf360c; }

    /* ── 카드 ── */
    .card {
      background: #fff; border-radius: 14px; padding: 16px 20px;
      margin-bottom: 10px; display: flex; align-items: center; gap: 14px;
      box-shadow: 0 1px 5px rgba(0,0,0,.07);
      transition: transform .15s, box-shadow .15s;
      border-left: 4px solid #e3f2fd;
      position: relative;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 5px 14px rgba(0,0,0,.11); }
    .card:nth-child(1) { border-left-color: #ffd600; }
    .card:nth-child(2) { border-left-color: #bdbdbd; }
    .card:nth-child(3) { border-left-color: #ff8f00; }
    .card.intraday-card { border-left-color: #ff8f00; }
    .card.intraday-card:nth-child(1) { border-left-color: #e65100; }

    .medal {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 900; flex-shrink: 0;
      background: #e8f5e9; color: #2e7d32;
    }
    .medal.m1 { background: #fff8e1; color: #f9a825; }
    .medal.m2 { background: #f5f5f5; color: #757575; }
    .medal.m3 { background: #fff3e0; color: #e65100; }
    .medal.intra { background: #fff3e0; color: #e65100; }
    .medal.intra.m1 { background: #fbe9e7; color: #bf360c; }

    .stock-info { flex: 1; min-width: 0; }
    .stock-name  { font-size: 15px; font-weight: 800;
                   white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stock-sub   { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
    .stock-ticker { font-size: 11px; background: #e3f2fd; color: #1565c0;
                    padding: 2px 8px; border-radius: 8px; font-weight: 600; }
    .stock-mktcap { font-size: 12px; color: #666; }
    .stock-name-link { color: inherit; text-decoration: none; }
    .stock-name-link:hover { color: #1565c0; text-decoration: underline; }
    .stock-ticker-link { text-decoration: none; display: inline-flex; align-items: center; }
    .stock-ticker-link .stock-ticker::after { content: ' ↗'; font-size: 9px; opacity: .55; }
    .stock-ticker-link:hover .stock-ticker { background: #bbdefb; }

    .rank-change { text-align: right; flex-shrink: 0; }
    .change-num  { font-size: 28px; font-weight: 900; color: #e53935; line-height: 1; }
    .change-arrow { color: #e53935; font-size: 15px; }
    .rank-path   { font-size: 12px; color: #777; margin-top: 3px; }
    .rank-path strong { color: #333; }

    /* ── 히스토리 차트 박스 ── */
    .hist-box {
      background: #fff; border-radius: 14px; padding: 18px 20px 14px;
      margin-top: 18px;
      box-shadow: 0 1px 5px rgba(0,0,0,.07);
      border-top: 3px solid #e3f2fd;
    }
    .hist-box.intraday { border-top-color: #ffe0b2; }
    .hist-box.daily    { border-top-color: #c8e6c9; }
    .hist-box.weekly   { border-top-color: #bbdefb; }
    .hist-box.monthly  { border-top-color: #e1bee7; }
    .hist-box.streak   { border-top-color: #ffd600; }

    .hist-title {
      font-size: 13px; font-weight: 700; color: #555;
      margin-bottom: 14px; display: flex; align-items: center; gap: 6px;
    }
    .hist-title .hist-badge {
      font-size: 11px; font-weight: 700; padding: 2px 9px;
      border-radius: 8px; color: #fff;
    }
    .hist-badge.intraday { background: #e65100; }
    .hist-badge.daily    { background: #2e7d32; }
    .hist-badge.weekly   { background: #1565c0; }
    .hist-badge.monthly  { background: #6a1b9a; }
    .hist-badge.streak   { background: #f57f17; }

    /* ── 중복 탭 배지 ── */
    .cross-badge {
      display: inline-flex; align-items: center;
      font-size: 10px; font-weight: 800; padding: 2px 7px;
      border-radius: 8px; margin-left: 5px; vertical-align: middle; white-space: nowrap;
    }
    .cross-badge.c2 { background: #fff8e1; color: #f9a825; border: 1px solid #ffd54f; }
    .cross-badge.c3 { background: #fff3e0; color: #e65100; border: 1px solid #ffb74d; }
    .cross-badge.c4 { background: #fbe9e7; color: #c62828; border: 1px solid #e57373; }

    /* ── 종합 분석 페이지 ── */
    .summary-trend {
      background: #fff; border-radius: 14px; padding: 16px 20px;
      margin-bottom: 14px; box-shadow: 0 1px 5px rgba(0,0,0,.07);
      border-top: 3px solid #1565c0;
    }
    .trend-title {
      font-size: 13px; font-weight: 700; color: #1565c0;
      margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
    }
    .trend-row { font-size: 13px; color: #333; margin-bottom: 7px; line-height: 1.7; }
    .summary-section-title {
      font-size: 12px; font-weight: 700; color: #666;
      margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #eee;
    }
    .summary-card {
      background: #fff; border-radius: 14px; padding: 14px 18px;
      margin-bottom: 9px; box-shadow: 0 1px 5px rgba(0,0,0,.07);
      border-left: 4px solid #e3f2fd;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
    }
    .summary-card.hot1 { border-left-color: #e53935; }
    .summary-card.hot2 { border-left-color: #ff8f00; }
    .mkt-tag {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 6px;
      font-size: 10px; font-weight: 700; white-space: nowrap;
    }
    .mkt-tag.korea { background: #e8f5e9; color: #2e7d32; }
    .mkt-tag.us    { background: #e3f2fd; color: #1565c0; }
    .mkt-tag.coin  { background: #fff3e0; color: #e65100; }
    .mkt-tag.p-intraday { background: #fbe9e7; color: #bf360c; }
    .mkt-tag.p-daily    { background: #e8f5e9; color: #2e7d32; }
    .mkt-tag.p-weekly   { background: #e3f2fd; color: #1565c0; }
    .mkt-tag.p-monthly  { background: #f3e5f5; color: #6a1b9a; }
    .mkt-tag.p-streak   { background: #fff8e1; color: #f57f17; }

    .hist-chart-wrap {
      position: relative; width: 100%; height: 280px;
    }
    .hist-chart-wrap canvas { width: 100% !important; height: 100% !important; }

    .hist-legend {
      display: flex; flex-wrap: wrap; gap: 10px;
      margin-top: 12px; padding-top: 10px;
      border-top: 1px solid #f5f5f5;
    }
    .hist-legend-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; font-weight: 600; color: #444;
    }

    /* ── AI 분석 버튼 ── */
    .ai-btn-group { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .ai-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 11px; border-radius: 20px; border: none;
      color: #fff; font-size: 11px; font-weight: 700; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,.15); transition: all .18s;
      white-space: nowrap; flex-shrink: 0;
    }
    .ai-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,.22); }
    .ai-btn.claude  { background: linear-gradient(135deg, #c96442 0%, #a0522d 100%); }
    .ai-btn.gemini  { background: linear-gradient(135deg, #1a73e8 0%, #1557b0 100%); }
    .ai-btn.chatgpt { background: linear-gradient(135deg, #10a37f 0%, #0d8a6c 100%); }

    /* ── 토스트 알림 ── */
    .claude-toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: #1a1a2e; color: #fff; padding: 11px 22px;
      border-radius: 24px; font-size: 13px; font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,.3); opacity: 0;
      transition: all .35s; z-index: 9999; white-space: nowrap; max-width: 90vw;
    }
    .claude-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .claude-toast.warn { background: #e65100; }

    /* ── 프롬프트 모달 (클립보드 실패 시) ── */
    #claude-modal { position: fixed; inset: 0; z-index: 9998;
                    display: flex; align-items: center; justify-content: center; }
    .modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
    .modal-box { position: relative; background: #fff; border-radius: 16px;
                 width: 90%; max-width: 560px; overflow: hidden;
                 box-shadow: 0 8px 32px rgba(0,0,0,.25); }
    .modal-hd { display: flex; justify-content: space-between; align-items: center;
                padding: 14px 18px; font-weight: 700; font-size: 14px;
                border-bottom: 1px solid #eee; }
    .modal-hd button { background: none; border: none; font-size: 18px;
                        cursor: pointer; color: #999; }
    .modal-body { width: 100%; height: 300px; padding: 14px 18px;
                  font-size: 13px; line-height: 1.65; border: none;
                  resize: none; outline: none; color: #333; }
    .modal-ft { padding: 12px 18px; border-top: 1px solid #eee; text-align: right; }
    .modal-copy-btn { padding: 8px 20px; background: #c96442; color: #fff;
                      border: none; border-radius: 12px; font-weight: 700;
                      font-size: 13px; cursor: pointer; }
    .modal-copy-btn:hover { background: #a0522d; }

    /* ── 업데이트 버튼 ── */
    .update-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 11px; border-radius: 20px; border: none;
      background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%);
      color: #fff; font-size: 11px; font-weight: 700; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,.15); transition: all .18s; white-space: nowrap;
    }
    .update-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,.22); }
    .update-btn:disabled { opacity:.6; cursor:not-allowed; transform:none; }

    /* ── 연속 순위 상승 ── */
    .streak-box {
      background: #fff; border-radius: 14px; padding: 18px 20px 14px;
      margin-top: 18px; box-shadow: 0 1px 5px rgba(0,0,0,.07);
      border-top: 3px solid #ffd600;
    }
    .streak-title {
      font-size: 13px; font-weight: 700; color: #555;
      margin-bottom: 14px; display: flex; align-items: center; gap: 6px;
    }
    .streak-badge {
      font-size: 11px; font-weight: 700; padding: 2px 9px;
      border-radius: 8px; color: #fff; background: #f57f17;
    }
    .streak-card {
      background: #fffde7; border-radius: 10px; padding: 12px 16px;
      margin-bottom: 8px; display: flex; align-items: center; gap: 12px;
      border-left: 4px solid #ffd600;
    }
    .streak-days { text-align: center; flex-shrink: 0; width: 52px; }
    .streak-days .days-num { font-size: 22px; font-weight: 900; color: #f57f17; line-height: 1; }
    .streak-days .days-label { font-size: 10px; color: #999; margin-top: 2px; }
    .streak-rank { font-size: 11px; color: #666; margin-top: 3px; }

    /* ── PAT 설정 모달 ── */
    #pat-modal { position: fixed; inset: 0; z-index: 9999;
                 display: flex; align-items: center; justify-content: center; }
    .pat-input {
      width: 100%; padding: 10px 14px; border: 1.5px solid #ddd;
      border-radius: 10px; font-size: 13px; margin-top: 10px;
      font-family: monospace; outline: none; box-sizing: border-box;
    }
    .pat-input:focus { border-color: #1565c0; }
    .pat-hint { font-size: 12px; color: #999; margin-top: 8px; line-height: 1.55; }

    /* ── 데이터 없음 ── */
    .no-data {
      text-align: center; padding: 44px 20px;
      background: #fff; border-radius: 14px;
      color: #aaa; box-shadow: 0 1px 5px rgba(0,0,0,.06);
    }
    .no-data .icon { font-size: 38px; margin-bottom: 10px; }

    /* ── 관심종목 ☆ 버튼 ── */
    .watch-btn {
      background: none; border: none; cursor: pointer;
      font-size: 18px; padding: 2px 6px; border-radius: 6px;
      color: #ccc; transition: color .15s, transform .12s;
      flex-shrink: 0; line-height: 1;
    }
    .watch-btn:hover { color: #f9a825; transform: scale(1.2); }
    .watch-btn.active { color: #f9a825; }

    /* ── 관심종목 그룹 헤더 ── */
    .cwl-group-header { font-size: 12px; font-weight: 700; color: #555; margin: 16px 0 6px; padding-left: 4px; border-bottom: 1px solid #eee; }
    .cwl-group-count { background: #e8eaf6; color: #3949ab; border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 6px; }

    /* ── 관심종목 관리 폼 ── */
    .custom-manage {
      background: #fff; border-radius: 14px; padding: 20px 22px;
      box-shadow: 0 1px 5px rgba(0,0,0,.07);
    }
    .custom-manage h3 { font-size: 14px; font-weight: 700; color: #333; margin-bottom: 14px; }
    .custom-add-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .custom-add-row input {
      flex: 1; min-width: 80px; padding: 8px 12px;
      border: 1.5px solid #ddd; border-radius: 10px; font-size: 13px; outline: none;
    }
    .custom-add-row input:focus { border-color: #1565c0; }
    .custom-add-row select {
      padding: 8px 10px; border: 1.5px solid #ddd; border-radius: 10px;
      font-size: 13px; outline: none; background: #fff;
    }
    .custom-add-row select:focus { border-color: #1565c0; }
    .custom-add-btn {
      padding: 8px 18px; background: #1565c0; color: #fff;
      border: none; border-radius: 10px; font-size: 13px; font-weight: 700;
      cursor: pointer; white-space: nowrap;
    }
    .custom-add-btn:hover { background: #0d47a1; }
    .custom-stock-list { margin-top: 4px; }
    .custom-stock-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 0; border-bottom: 1px solid #f5f5f5;
    }
    .custom-stock-item:last-child { border-bottom: none; }
    .custom-stock-item .csi-info { flex: 1; min-width: 0; }
    .custom-stock-item .csi-name { font-size: 13px; font-weight: 700; color: #222; }
    .custom-stock-item .csi-meta { font-size: 11px; color: #999; margin-top: 2px; }
    .custom-stock-item .csi-rm {
      background: none; border: none; cursor: pointer;
      color: #ccc; font-size: 16px; padding: 2px 6px; border-radius: 4px;
    }
    .custom-stock-item .csi-rm:hover { color: #e53935; }
    .custom-empty { color: #bbb; font-size: 13px; text-align: center; padding: 20px 0; }
    .custom-sync-row {
      display: flex; gap: 8px; margin-top: 16px; padding-top: 14px;
      border-top: 1px solid #eee; flex-wrap: wrap; align-items: center;
    }
    .custom-sync-btn {
      padding: 7px 18px; border-radius: 14px; border: none;
      font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .custom-sync-btn.save { background: #2e7d32; color: #fff; }
    .custom-sync-btn.save:hover { background: #1b5e20; }
    .custom-sync-hint { font-size: 11px; color: #aaa; }

    /* ── 관심종목 시총 변동률 카드 ── */
    .custom-card {
      background: #fff; border-radius: 14px; padding: 16px 20px;
      margin-bottom: 10px; display: flex; align-items: center; gap: 14px;
      box-shadow: 0 1px 5px rgba(0,0,0,.07);
      transition: transform .15s, box-shadow .15s;
      border-left: 4px solid #e3f2fd;
    }
    .custom-card:hover { transform: translateY(-2px); box-shadow: 0 5px 14px rgba(0,0,0,.11); }
    .custom-card:nth-child(1) { border-left-color: #ffd600; }
    .custom-card:nth-child(2) { border-left-color: #bdbdbd; }
    .custom-card:nth-child(3) { border-left-color: #ff8f00; }
    .chg-num { font-size: 24px; font-weight: 900; line-height: 1; }
    .chg-num.up   { color: #e53935; }
    .chg-num.down { color: #1565c0; }
    .chg-num.flat { color: #888; }
    .mkt-tag.kospi  { background: #e8f5e9; color: #2e7d32; }
    .mkt-tag.kosdaq { background: #e0f2f1; color: #00695c; }

    /* ── 푸터 ── */
    footer {
      text-align: center; padding: 20px 16px;
      font-size: 11px; color: #bbb;
      border-top: 1px solid #e0e0e0; margin-top: 16px;
    }

    @media (max-width: 520px) {
      header { padding: 18px 14px 14px; }
      header h1 { font-size: 17px; }
      .change-num { font-size: 22px; }
      .hist-chart-wrap { height: 220px; }
    }
  </style>
</head>
<body>

<header>

function fmtDate(d) {
  if (!d || d.length < 8) return d || '-';
  return `${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6,8)}`;
}
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function naverUrl(ticker) {
  // 6자리 숫자 = 한국 종목 코드 → 종목 직접 페이지
  // 그 외 (미국/코인 영문 티커) → 검색 결과 페이지
  return /^\d{6}$/.test(ticker)
    ? `https://finance.naver.com/item/main.naver?code=${ticker}`
    : `https://finance.naver.com/search/search.naver?query=${encodeURIComponent(ticker)}&endUrl=&encoding=UTF-8`;
}

  if (currentGroup === 'custom') return DATA_CUSTOM;
  return DATA_CRYPTO;
}

/* ── 초기화 ─────────────────────────────────────────────────────────────── */
function init() {
  if (!DATA_KR) { showError('한국 데이터를 불러올 수 없습니다.'); return; }
  currentGroup  = 'korea';
  currentMarket = 'kospi';
  currentPeriod = 'intraday';
  buildGroupTabs();
  buildMarketTabs();
  buildPeriodTabs();
  updateHeader();
  render();
}

/* ── 그룹 탭 구성 ────────────────────────────────────────────────────────── */
function buildGroupTabs() {
  document.querySelectorAll('.group-tabs .tab-btn').forEach((btn, i) => {
    const groups = ['korea','us','coin','midcap','custom'];
    btn.classList.toggle('active', groups[i] === currentGroup);
  });
}

/* ── 마켓 탭 구성 ────────────────────────────────────────────────────────── */
function buildMarketTabs() {
  const container = document.getElementById('market-tabs');
  const markets   = GROUP_MARKETS[currentGroup];

  // 종합·코인은 마켓 탭 숨김
  if (markets.length <= 1) {
    container.style.display = 'none';
    return;
  }
  container.style.display = 'flex';
  container.innerHTML = markets.map(m =>
    `<button class="tab-btn${m===currentMarket?' active':''}"
             onclick="switchMarket('${m}')">${esc(MARKET_LABEL[m])}</button>`
  ).join('');
}

/* ── 기간 탭 구성 ────────────────────────────────────────────────────────── */
function buildPeriodTabs() {
  const container = document.getElementById('period-tabs');
  const periods   = GROUP_PERIODS[currentGroup];
  container.innerHTML = periods.map(p => {
    const extra = p === 'intraday' ? ' intraday'
                : p === 'streak'   ? ' streak'
                : p === 'summary'  ? ' summary-period'
                : p === 'manage'   ? ' manage-period'
                : '';
    const cls   = `tab-btn${extra}${p===currentPeriod?' active':''}`;
    return `<button class="${cls}" onclick="switchPeriod('${p}')">${PERIOD_META[p].label}</button>`;
  }).join('');
}

/* ── 그룹 내 중복 탭 종목 집계 ───────────────────────────────────────────── */
function computeGroupCrossTab(group, market) {
  const data = getGroupData();
  const counts = {};  // ticker → {count, tabs[]}
  function add(ticker, label) {
    if (!counts[ticker]) counts[ticker] = { count: 0, tabs: [] };
    counts[ticker].count++;
    counts[ticker].tabs.push(label);
  }
  if (group === 'korea') {
    (data?.intraday?.[market]?.top5 || []).forEach(s => add(s.ticker, '장중'));
    ['daily','weekly','monthly'].forEach(p =>
      (data?.[market]?.[p]?.top5 || []).forEach(s => add(s.ticker, PERIOD_META[p].label)));
    (data?.[market]?.streak || []).forEach(s => add(s.ticker, '연속상승'));
  } else if (group === 'us') {
    ['daily','weekly','monthly'].forEach(p =>
      (data?.[market]?.[p]?.top5 || []).forEach(s => add(s.ticker, PERIOD_META[p].label)));
    (data?.[market]?.streak || []).forEach(s => add(s.ticker, '연속상승'));
  } else if (group === 'coin') {
    ['daily','weekly','monthly'].forEach(p =>
      (data?.coin?.[p]?.top5 || []).forEach(s => add(s.ticker, PERIOD_META[p].label)));
    (data?.coin?.streak || []).forEach(s => add(s.ticker, '연속상승'));
  }
  return counts;
}

function crossBadgeHTML(ticker, crossMap) {
  const info = crossMap?.[ticker];
  if (!info || info.count < 2) return '';
  const cls = info.count >= 4 ? 'c4' : info.count === 3 ? 'c3' : 'c2';
  const tip = info.tabs.join('·');
  return `<span class="cross-badge ${cls}" title="${esc(tip)}">${info.count}개탭</span>`;
}

/* ── 종합 데이터 집계 (현재 그룹 기준) ──────────────────────────────────── */
function computeSummaryData() {
  const all = {};   // key: `market:ticker`

  function add(market, period, periodLabel, s) {
    const key = `${market}:${s.ticker}`;
    if (!all[key]) {
      all[key] = {
        market, ticker: s.ticker,
        name: s.name, market_cap_str: s.market_cap_str,
        rank: s.rank, count: 0,
        appearances: [], markets: new Set(),
      };
    }
    const item = all[key];
    item.count++;
    if (!item.appearances.find(a => a.period === period && a.market === market)) {
      item.appearances.push({ period, periodLabel, market });
      item.markets.add(market);
    }
    if (s.rank < item.rank) {
      item.rank = s.rank;
      item.market_cap_str = s.market_cap_str;
    }
  }

  if (currentGroup === 'korea' && DATA_KR) {
    ['kospi','kosdaq'].forEach(mkt => {
      (DATA_KR?.intraday?.[mkt]?.top5 || []).forEach(s => add(mkt, 'intraday', '장중', s));
      ['daily','weekly','monthly'].forEach(p =>
        (DATA_KR?.[mkt]?.[p]?.top5 || []).forEach(s => add(mkt, p, PERIOD_META[p].label, s)));
      (DATA_KR?.[mkt]?.streak || []).forEach(s => add(mkt, 'streak', '연속상승', s));
    });
  } else if (currentGroup === 'us' && DATA_US) {
    ['sp500','nasdaq100'].forEach(mkt => {
      ['daily','weekly','monthly'].forEach(p =>
        (DATA_US?.[mkt]?.[p]?.top5 || []).forEach(s => add(mkt, p, PERIOD_META[p].label, s)));
      (DATA_US?.[mkt]?.streak || []).forEach(s => add(mkt, 'streak', '연속상승', s));
    });
  } else if (currentGroup === 'coin' && DATA_CRYPTO) {
    ['daily','weekly','monthly'].forEach(p =>
      (DATA_CRYPTO?.coin?.[p]?.top5 || []).forEach(s => add('coin', p, PERIOD_META[p].label, s)));
    (DATA_CRYPTO?.coin?.streak || []).forEach(s => add('coin', 'streak', '연속상승', s));
  } else if (currentGroup === 'midcap' && DATA_MIDCAP) {
    ['daily','weekly','monthly'].forEach(p =>
      (DATA_MIDCAP?.midcap?.[p]?.top5 || []).forEach(s => add('midcap', p, PERIOD_META[p].label, s)));
    (DATA_MIDCAP?.midcap?.streak || []).forEach(s => add('midcap', 'streak', '연속상승', s));
  }

  return Object.values(all).sort((a, b) => b.count - a.count || a.rank - b.rank);
}

/* ── 종합 렌더링 ─────────────────────────────────────────────────────────── */
function renderSummaryOrWait() {
  if (currentGroup === 'us' && !DATA_US) {
    showLoadingSpinner('🇺🇸 미국 데이터 로딩 중...');
    fetch('data/report_us.json')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(d => { DATA_US = d; renderSummary(); })
      .catch(e => showError(`데이터 로딩 실패: ${e}`));
    return;
  }
  if (currentGroup === 'coin' && !DATA_CRYPTO) {
    showLoadingSpinner('🪙 코인 데이터 로딩 중...');
    fetch('data/report_crypto.json')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(d => { DATA_CRYPTO = d; renderSummary(); })
      .catch(e => showError(`데이터 로딩 실패: ${e}`));
    return;
  }
  if (currentGroup === 'midcap' && !DATA_MIDCAP) {
    showLoadingSpinner('📈 중형주 데이터 로딩 중...');
    fetch('data/report_midcap.json')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(d => { DATA_MIDCAP = d; renderSummary(); })
      .catch(e => showError(`데이터 로딩 실패: ${e}`));
    return;
  }
  renderSummary();
}

function renderSummary() {
  const cards = document.getElementById('cards');
  const hist  = document.getElementById('hist-section');
  const label = document.getElementById('compare-label');
  document.getElementById('intraday-banner').style.display = 'none';

  const grpLabel = {
    korea:  '🇰🇷 한국 (KOSPI + KOSDAQ)',
    us:     '🇺🇸 미국 (S&P 500 + NASDAQ 100)',
    coin:   '🪙 암호화폐',
    midcap: '📈 중형주 (Russell 1000 하위 500)',
  }[currentGroup];
  document.getElementById('section-title').textContent = `${grpLabel} 전 기간 종합 분석`;
  label.textContent = '';
  hist.innerHTML = '';
  if (activeChart) { activeChart.destroy(); activeChart = null; }

  const all    = computeSummaryData();
  const hot    = all.filter(s => s.count >= 3);
  const warm   = all.filter(s => s.count === 2);
  const single = all.filter(s => s.count === 1);

  // ── 동향 분석 섹션 ──────────────────────────────────────────────────────
  let html = `<div class="summary-trend"><div class="trend-title">📊 자금 유입 동향 — ${grpLabel}</div>`;
  if (hot.length) {
    html += `<div class="trend-row">🔴 <strong>다중 기간 집중 종목</strong> (3개 이상 기간): ` +
      hot.map(s=>`<strong style="color:#e53935">${esc(s.name)}</strong>`).join(' · ') + `</div>`;
  }
  if (warm.length) {
    html += `<div class="trend-row">🟠 <strong>복수 기간 신호 종목</strong> (2개 기간): ` +
      warm.map(s=>`<span style="color:#e65100">${esc(s.name)}</span>`).join(' · ') + `</div>`;
  }
  if (all.length) {
    const mkts = [...new Set(all.map(s=>s.market))];
    html += `<div class="trend-row" style="font-size:12px;color:#888;margin-top:4px">전체 선정 종목: ${all.length}개 (${mkts.map(m=>MARKET_LABEL[m]||m).join(' + ')})</div>`;
  } else {
    html += `<div class="trend-row" style="color:#999">데이터가 없습니다.</div>`;
  }
  html += `</div>`;

  // ── 카드 렌더링 헬퍼 ────────────────────────────────────────────────────
  function summaryCards(list, sectionTitle, hotCls) {
    if (!list.length) return '';
    let h = `<div class="summary-section-title">${sectionTitle}</div>`;
    h += list.map(s => {
      const nameUrl = currentGroup === 'coin'
        ? `https://coinness.com/search?q=${encodeURIComponent(s.ticker)}`
        : `https://kr.investing.com/search/?q=${encodeURIComponent(s.ticker)}`;
      const tickerUrl = currentGroup === 'korea' ? naverUrl(s.ticker)
        : currentGroup === 'coin'
          ? `https://coinmarketcap.com/ko/search/?q=${encodeURIComponent(s.ticker)}`
          : `https://finance.yahoo.com/quote/${encodeURIComponent(s.ticker)}`;
      const appTags = [...new Map(s.appearances.map(a=>[a.period+a.market,a])).values()]
        .map(a=>`<span class="mkt-tag p-${a.period}">${a.periodLabel}</span>`).join(' ');
      const mktNames = [...s.markets].map(m=>MARKET_LABEL[m]||m).join('·');
      const mktTag   = `<span class="mkt-tag ${currentGroup}">${mktNames}</span>`;
      const cntColor = s.count>=3?'#e53935':s.count===2?'#e65100':'#2e7d32';
      const cntLabel = s.count>=2 ? `${s.count}⭐` : `${s.rank}위`;
      return `
      <div class="summary-card ${hotCls}">
        <div style="flex:1;min-width:0">
          <div class="stock-name" style="font-size:14px;font-weight:800">
            <a class="stock-name-link" href="${nameUrl}" target="_blank" rel="noopener">${esc(s.name)}</a>
            ${s.count>=2?`<span class="cross-badge ${s.count>=4?'c4':s.count===3?'c3':'c2'}" title="${esc(s.appearances.map(a=>a.periodLabel).join('·'))}">${s.count}개기간</span>`:''}
          </div>
          <div class="stock-sub" style="margin-top:5px;flex-wrap:wrap;gap:5px">
            ${mktTag}
            <a class="stock-ticker-link" href="${tickerUrl}" target="_blank" rel="noopener">
              <span class="stock-ticker">${esc(s.ticker)}</span>
            </a>
            <span class="stock-mktcap">시총 ${esc(s.market_cap_str)}</span>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">${appTags}</div>
        </div>
        <div style="text-align:right;flex-shrink:0;padding-left:8px">
          <div style="font-size:20px;font-weight:900;color:${cntColor};line-height:1">${cntLabel}</div>
          <div class="rank-path" style="margin-top:3px">${s.count>=2?'복수 기간 신호':'순위 '+s.rank+'위'}</div>
        </div>
      </div>`;
    }).join('');
    return h;
  }

  html += summaryCards(hot,    '🔴 집중 자금 유입 종목 — 3개 이상 기간 동시 선정', 'hot1');
  html += summaryCards(warm,   '🟠 복수 기간 신호 종목 — 2개 기간 선정', 'hot2');
  html += summaryCards(single.slice(0, 15), '⚪ 개별 기간 선정 종목 (상위 15개)', '');

  cards.innerHTML = html;
}

/* ── 헤더 업데이트 ───────────────────────────────────────────────────────── */
function updateHeader() {
  const data = getGroupData();
  document.getElementById('page-title').textContent    = GROUP_TITLE[currentGroup];
  document.getElementById('last-updated').textContent  = data?.updated_at  || '-';
  document.getElementById('current-date').textContent  = fmtDate(data?.current_date);
}

/* ── 그룹 전환 ───────────────────────────────────────────────────────────── */
function switchGroup(g) {
  currentGroup  = g;
  currentMarket = GROUP_MARKETS[g][0];
  currentPeriod = GROUP_PERIODS[g][0];

  buildGroupTabs();
  buildMarketTabs();
  buildPeriodTabs();

  if (g === 'us' && !DATA_US) {
    loadUSData();
    return;
  }
  if (g === 'coin' && !DATA_CRYPTO) {
    loadCryptoData();
    return;
  }
  if (g === 'midcap' && !DATA_MIDCAP) {
    loadMidcapData();
    return;
  }
  if (g === 'custom') {
    updateHeader();
    render();
    return;
  }

  updateHeader();
  render();
}

/* ── 마켓 전환 ───────────────────────────────────────────────────────────── */
function switchMarket(m) {
  currentMarket = m;
  buildMarketTabs();
  render();
}

/* ── 기간 전환 ───────────────────────────────────────────────────────────── */
function switchPeriod(p) {
  currentPeriod = p;
  buildPeriodTabs();
  render();
}

/* ── 메인 렌더링 ─────────────────────────────────────────────────────────── */
function render() {
  if (activeChart) { activeChart.destroy(); activeChart = null; }

  if (currentGroup === 'custom') {
    document.getElementById('intraday-banner').style.display = 'none';
    document.getElementById('compare-label').className = 'compare-label';
    if (currentPeriod === 'manage') {
      document.getElementById('section-title').textContent = '관심종목 관리';
      renderCustomManage();
    } else {
      document.getElementById('section-title').textContent = PERIOD_META[currentPeriod]?.title || '';
      renderCustomPeriod();
    }
    return;
  }

  if (currentPeriod === 'summary') { renderSummaryOrWait(); return; }

  document.getElementById('section-title').textContent = PERIOD_META[currentPeriod].title;
  document.getElementById('intraday-banner').style.display = 'none';
  document.getElementById('compare-label').className = 'compare-label';

  if (currentGroup === 'korea' && currentPeriod === 'intraday') {
    renderIntraday();
  } else if (currentPeriod === 'streak') {
    renderStreakPeriod();
  } else {
    renderPeriod();
  }
}

/* ── 일별/주별/월별 탭 렌더링 (모든 그룹) ──────────────────────────────── */
function renderPeriod() {
  const cards = document.getElementById('cards');
  const label = document.getElementById('compare-label');

  if (!pd || !pd.available || !pd.top5?.length) {
    label.textContent = '';

      pd?.prev_date ? '기준: ' + fmtDate(pd.prev_date) : '데이터 부족'
    );
    document.getElementById('hist-section').innerHTML = '';
    return;
  }

  label.className   = 'compare-label';
  label.textContent = '기준: ' + fmtDate(pd.prev_date);

  const periodCross = computeGroupCrossTab(currentGroup, currentMarket);
  cards.innerHTML = pd.top5.map((s, i) => {
    const isCoin  = currentGroup === 'coin';
    const isKorea = currentGroup === 'korea';
    const nameUrl   = isCoin
      ? `https://coinness.com/search?q=${encodeURIComponent(s.ticker)}`
      : `https://kr.investing.com/search/?q=${encodeURIComponent(s.ticker)}`;

/* ── 히스토리 차트 렌더링 ────────────────────────────────────────────────── */
function renderHistoryChart(hdata, period) {
  const section = document.getElementById('hist-section');
  section.innerHTML = '';
  if (!hdata || !hdata.timeline?.length) return;

  const meta = PERIOD_META[period];
  section.innerHTML = `
    <div class="hist-box ${period}">
      <div class="hist-title">
        <span class="hist-badge ${period}">${meta.label}</span>
        ${esc(meta.histTitle)}
      </div>
      <div class="hist-chart-wrap"><canvas id="histCanvas"></canvas></div>
      <div class="hist-legend" id="hist-legend"></div>
    </div>`;

  const labels   = hdata.timeline.map(t => t.label);
  const tickers  = hdata.tickers;
  const datasets = tickers.map((ticker, idx) => {
    const st = CB_PALETTE[idx] || CB_PALETTE[4];
    return {
      label:               hdata.names[ticker] || ticker,
      data:                hdata.timeline.map(t => t.ranks[ticker] ?? null),
      borderColor:         st.color,
      backgroundColor:     st.color + '15',
      borderWidth:         st.width,
      borderDash:          st.dash,
      pointStyle:          st.point,
      pointRadius:         5,
      pointHoverRadius:    8,
      pointBackgroundColor: st.color,
      pointBorderColor:    '#fff',
      pointBorderWidth:    1.5,
      spanGaps:            true,
      tension:             0.25,
    };
  });

  const ctx = document.getElementById('histCanvas').getContext('2d');
  activeChart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive:          true,
      maintainAspectRatio: false,
      interaction:         { mode: 'nearest', intersect: false, axis: 'xy' },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: items => items[0]?.label || '',
            label: item  => item.raw != null
              ? ` ${item.dataset.label}: ${item.raw}위` : null,
          },
          filter: item => item.raw != null,
        },
      },
      scales: {
        x: {
          ticks: {
            maxRotation: 45, minRotation: 20,
            font: { size: 10 }, color: '#999',
            maxTicksLimit: 20,
          },
          grid: { color: '#f5f5f5' },
        },
        y: {
          reverse:      true,
          min:          1,
          suggestedMax: currentPeriod === 'intraday' ? 100 : 50,
          ticks: {
            stepSize: 10,
            font: { size: 11 }, color: '#999',
            callback: v => `${v}위`,
          },
          grid:  { color: '#f0f0f0' },
          title: { display: true, text: '순위 (낮을수록 상위)',
                   font: { size: 10 }, color: '#bbb' },
        },
      },
    },
  });

  // 커스텀 범례
  document.getElementById('hist-legend').innerHTML = tickers.map((t, i) => {
    const st   = CB_PALETTE[i] || CB_PALETTE[4];
    const dash = st.dash.length ? `stroke-dasharray="${st.dash.join(' ')}"` : '';
    const svg  = `<svg width="28" height="10" style="vertical-align:middle;margin-right:5px">
      <line x1="0" y1="5" x2="28" y2="5"
            stroke="${st.color}" stroke-width="${st.width}" ${dash}/>
    </svg>`;
    return `<div class="hist-legend-item">${svg}${esc(hdata.names[t] || t)}</div>`;
  }).join('');
}

function openAnalysis(serviceUrl, serviceName) {
  const prompt = buildClaudePrompt();
  if (!prompt) { showToast('현재 표시된 종목이 없습니다.', 'warn'); return; }

  navigator.clipboard.writeText(prompt)
    .then(() => {
      window.open(serviceUrl, '_blank', 'noopener');
      showToast(`✅ 프롬프트 복사 완료 — ${serviceName} 새 창에서 붙여넣기(Ctrl+V) 하세요`, 'ok');
    })
    .catch(() => showPromptModal(prompt, serviceUrl, serviceName));
}

function showToast(msg, type) {
  const old = document.getElementById('_claude_toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.id = '_claude_toast';
  t.className = 'claude-toast' + (type === 'warn' ? ' warn' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 4500);
}

function showPromptModal(prompt, serviceUrl, serviceName) {
  const old = document.getElementById('claude-modal');

}

  renderHistoryChart(streakHistory, 'streak');

async function triggerUpdate() {
  const pat = getPAT();
  if (!pat) { showPATModal(); return; }

  const WORKFLOW = { korea:'update.yml', us:'update_us.yml', coin:'update_crypto.yml', midcap:'update_midcap.yml', custom:'update_custom.yml' };
  const workflow = WORKFLOW[currentGroup];
  const btn = document.getElementById('update-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 요청 중...'; }

  try {
    const resp = await fetch(
      `https://api.github.com/repos/superhsh/kospi-rank-tracker/actions/workflows/${workflow}/dispatches`,
      {
        method:  'POST',
        headers: {
          'Authorization': `Bearer ${pat}`,
          'Accept':        'application/vnd.github+json',
          'Content-Type':  'application/json',
        },
        body: JSON.stringify({ ref: 'main' }),
      }
    );
    if (resp.status === 204) {
      showToast('✅ 업데이트 요청 완료 — 1~2분 후 새로고침하세요', 'ok');
    } else if (resp.status === 401) {
      localStorage.removeItem('gh_pat');
      showToast('❌ PAT 인증 실패 — 다시 설정해주세요', 'warn');
    } else {
      showToast(`❌ 오류 ${resp.status} — PAT 권한(repo·workflow) 확인`, 'warn');
    }
  } catch(e) {
    showToast('❌ 네트워크 오류', 'warn');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🔄 업데이트'; }
  }
}

/* ── 관심종목 관리 탭 렌더링 ─────────────────────────────────────────────── */
function renderCustomManage() {
  const cards = document.getElementById('cards');
  document.getElementById('hist-section').innerHTML = '';
  document.getElementById('compare-label').textContent = '';

  const list    = cwlLoad();
  const mktName = m => ({ kospi:'KOSPI', kosdaq:'KOSDAQ', us:'미국 (NYSE/NASDAQ)', coin:'코인' }[m] || m);

  const MARKET_GROUPS = [
    { key: 'us',    label: '🇺🇸 미국 (NYSE/NASDAQ)', markets: ['us'] },
    { key: 'korea', label: '🇰🇷 한국',               markets: ['kospi','kosdaq'] },
    { key: 'coin',  label: '🪙 코인',                markets: ['coin'] },
  ];

  function buildGroupedList(lst) {
    return MARKET_GROUPS.map(grp => {
      const items = lst.filter(s => grp.markets.includes(s.market));
      if (!items.length) return '';
      return `
        <div class="cwl-group-header">${grp.label} <span class="cwl-group-count">${items.length}</span></div>
        ${items.map(s => `
          <div class="custom-stock-item">
            <div class="csi-info">
              <div class="csi-name">${esc(s.name)}</div>
              <div class="csi-meta">${esc(s.ticker)} &nbsp;·&nbsp; ${mktName(s.market)} &nbsp;·&nbsp; 추가: ${s.added_at||''}</div>
            </div>
            <button class="csi-rm" title="삭제" onclick="cwlRemove('${esc(s.ticker)}','${s.market}')">✕</button>
          </div>`).join('')}`;
    }).join('');
  }

  const itemsHTML = list.length
    ? buildGroupedList(list)
    : `<div class="custom-empty">등록된 종목이 없습니다.<br>위 폼으로 종목을 추가하세요.</div>`;

  cards.innerHTML = `
  <div class="custom-manage">
    <h3>⭐ 관심종목 추가</h3>
    <div class="custom-add-row">
      <input id="cwl-ticker" type="text" placeholder="티커 (예: 005930 / AAPL)" maxlength="20"
             onkeydown="if(event.key==='Enter')cwlAdd()"/>
      <input id="cwl-name"   type="text" placeholder="종목명 (선택)" maxlength="40"
             onkeydown="if(event.key==='Enter')cwlAdd()"/>
      <select id="cwl-market">
        <option value="kospi">한국 KOSPI</option>
        <option value="kosdaq">한국 KOSDAQ</option>
        <option value="us">미국 (NYSE/NASDAQ)</option>
      </select>
      <button class="custom-add-btn" onclick="cwlAdd()">추가</button>
    </div>
    <div class="custom-stock-list" id="cwl-list">${itemsHTML}</div>
    <div class="custom-sync-row">
      <button class="custom-sync-btn save" onclick="syncCustomWatchlist()">☁ GitHub 저장</button>
      <span class="custom-sync-hint">저장 후 Actions(⭐ Custom Watchlist Tracker)를 실행하면 시총 데이터가 수집됩니다</span>
    </div>
  </div>`;
}

/* ── 관심종목 기간별 변동률 렌더링 ───────────────────────────────────────── */
function renderCustomPeriod() {
  if (!DATA_CUSTOM) {
    loadCustomData();
    return;
  }

  const cards = document.getElementById('cards');
  const label = document.getElementById('compare-label');
  document.getElementById('hist-section').innerHTML = '';
  document.getElementById('intraday-banner').style.display = 'none';

  const pd = DATA_CUSTOM?.[currentPeriod];

  if (!pd || !pd.available || !pd.items?.length) {
    label.textContent = '';
    cards.innerHTML   = noDataHTML(
      pd?.prev_date
        ? '기준: ' + fmtDate(pd.prev_date)
        : '데이터 없음 — ⚙관리 탭에서 종목을 추가하고 GitHub Actions를 실행하세요'
    );
    return;
  }

  label.className   = 'compare-label';
  label.textContent = '기준: ' + fmtDate(pd.prev_date);

  const mktName = m => ({ kospi:'KOSPI', kosdaq:'KOSDAQ', us:'미국' }[m] || m);

  cards.innerHTML = pd.items.map((s, i) => {
    const isKorea   = s.market === 'kospi' || s.market === 'kosdaq';
    const tickerUrl = isKorea
      ? naverUrl(s.ticker)
      : `https://finance.yahoo.com/quote/${encodeURIComponent(s.ticker)}`;
    const nameUrl   = isKorea
      ? naverUrl(s.ticker)
      : `https://finance.yahoo.com/quote/${encodeURIComponent(s.ticker)}`;
    const mktCls    = s.market;
    const medalCls  = ['m1','m2','m3','',''][i] || '';
    const chgCls    = s.change_pct > 0 ? 'up' : s.change_pct < 0 ? 'down' : 'flat';
    const sign      = s.change_pct > 0 ? '+' : '';

    return `
    <div class="custom-card">
      <div class="medal ${medalCls}">${i + 1}</div>
      <div class="stock-info">
        <div class="stock-name">
          <a class="stock-name-link" href="${nameUrl}" target="_blank" rel="noopener">${esc(s.name)}</a>
        </div>
        <div class="stock-sub">
          <span class="mkt-tag ${mktCls}">${mktName(s.market)}</span>
          <a class="stock-ticker-link" href="${tickerUrl}" target="_blank" rel="noopener">
            <span class="stock-ticker">${esc(s.ticker)}</span>
          </a>
          <span class="stock-mktcap">${esc(s.market_cap_str)}</span>
        </div>
        <div style="font-size:11px;color:#aaa;margin-top:3px">이전: ${esc(s.prev_market_cap_str)}</div>
      </div>
      <div class="rank-change" style="text-align:right;min-width:80px">
        <div class="chg-num ${chgCls}">${sign}${s.change_pct}%</div>
        <div class="rank-path" style="margin-top:4px">${s.currency}</div>
      </div>
    </div>`;
  }).join('');
}

/* ════════════════════════════════════════════════════════════════════════════
   관심종목 커스텀 워치리스트 (Custom Watchlist)
════════════════════════════════════════════════════════════════════════════ */

const CWL_KEY = 'kospi_custom_wl';

function cwlLoad() {
  try { return JSON.parse(localStorage.getItem(CWL_KEY) || '[]'); }
  catch { return []; }
}
function cwlSave(list) { localStorage.setItem(CWL_KEY, JSON.stringify(list)); }

function cwlHas(ticker, market) {
  return cwlLoad().some(s => s.ticker === ticker && s.market === market);
}

/* ── custom watchlist 버튼 헬퍼 ─────────────────────────────────────────── */
function cwlMapMarket(market, group) {
  const MAP = { kospi:'kospi', kosdaq:'kosdaq', sp500:'us', nasdaq100:'us', midcap:'us', coin:'coin', us:'us' };
  return MAP[market] || MAP[group] || 'us';
}

function cwlBtnHTML(ticker, name, market, group) {
  const cwlMkt = cwlMapMarket(market, group);
  const has    = cwlHas(ticker, cwlMkt);
  return `<button class="watch-btn${has?' active':''}" title="${has?'관심종목 해제':'관심종목 추가'}"
    data-cwl-ticker="${esc(ticker)}" data-cwl-market="${cwlMkt}"
    onclick="cwlToggle('${esc(ticker)}','${esc(name)}','${cwlMkt}');event.stopPropagation()">
    ${has?'★':'☆'}
  </button>`;
}

function cwlToggle(ticker, name, market) {
  if (cwlHas(ticker, market)) cwlRemove(ticker, market);
  else cwlAddDirect(ticker, name, market);
  document.querySelectorAll('.watch-btn[data-cwl-ticker="'+ticker+'"][data-cwl-market="'+market+'"]').forEach(btn => {
    const has = cwlHas(ticker, market);
    btn.classList.toggle('active', has);
    btn.title     = has ? '관심종목 해제' : '관심종목 추가';
    btn.innerHTML = has ? '★' : '☆';
  });
}

function cwlAddDirect(ticker, name, market) {
  const list = cwlLoad();
  if (list.some(s => s.ticker === ticker && s.market === market)) return;
  list.push({ ticker, name, market, added_at: new Date().toISOString().slice(0,10) });
  cwlSave(list);
  showToast(`⭐ ${name}(${ticker}) 관심종목 추가됨`, 'ok');
}

function cwlAdd() {
  const tickerRaw = (document.getElementById('cwl-ticker')?.value || '').trim();
  const nameRaw   = (document.getElementById('cwl-name')?.value   || '').trim();
  const market    = document.getElementById('cwl-market')?.value   || 'us';
  if (!tickerRaw) { showToast('티커를 입력하세요.', 'warn'); return; }

  const ticker = market === 'us' ? tickerRaw.toUpperCase() : tickerRaw;
  const name   = nameRaw || ticker;
  const list   = cwlLoad();
  if (list.some(s => s.ticker === ticker && s.market === market)) {
    showToast('이미 등록된 종목입니다.', 'warn'); return;
  }
  list.push({ ticker, name, market, added_at: new Date().toISOString().slice(0,10) });
  cwlSave(list);
  if (document.getElementById('cwl-ticker')) document.getElementById('cwl-ticker').value = '';
  if (document.getElementById('cwl-name'))   document.getElementById('cwl-name').value   = '';
  showToast(`✅ ${name} (${ticker}) 추가 완료`, 'ok');
  renderCustomManage();
}

function cwlRemove(ticker, market) {
  cwlSave(cwlLoad().filter(s => !(s.ticker === ticker && s.market === market)));
  renderCustomManage();
}

async function syncCustomWatchlist() {
  const pat = getPAT();
  if (!pat) { showPATModal(); return; }

  const list = cwlLoad();
  const payload = {
    updated_at: new Date().toISOString().slice(0,16).replace('T',' '),
    stocks: list,
  };

  const repoMatch = window.location.hostname.match(/^([^.]+)\.github\.io$/);
  if (!repoMatch) { alert('GitHub Pages 환경에서만 동기화가 가능합니다.'); return; }
  const owner  = repoMatch[1];
  const repo   = window.location.pathname.split('/')[1] || '';
  const path   = 'data/custom_watchlist.json';
  const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

  try {
    const getResp = await fetch(apiUrl, {
      headers: { Authorization: `token ${pat}`, Accept: 'application/vnd.github+json' },
    });
    let sha = '';
    if (getResp.ok) { const info = await getResp.json(); sha = info.sha || ''; }

    const content = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2) + '\n')));
    const putResp = await fetch(apiUrl, {
      method: 'PUT',
      headers: { Authorization: `token ${pat}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `⭐ Update custom watchlist (${list.length}종목)`, content, ...(sha ? { sha } : {}) }),
    });

    if (putResp.ok) {
      showToast(`✅ GitHub 저장 완료 (${list.length}종목)`, 'ok');
      // 저장 성공 후 backfill+daily 워크플로우 자동 실행
      const pat2 = getPAT();
      if (pat2) {
        fetch(
          'https://api.github.com/repos/superhsh/kospi-rank-tracker/actions/workflows/update_custom.yml/dispatches',
          {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${pat2}`,
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ ref: 'main' }),
          }
        ).then(r => {
          if (r.status === 204) showToast('🔄 시총 업데이트 워크플로우 실행 중...', 'ok');
        }).catch(() => {});
      }
    } else {
      const err = await putResp.json();
      showToast(`❌ 저장 실패: ${err.message}`, 'warn');
    }
  } catch (e) { showToast(`❌ 오류: ${e.message}`, 'warn'); }
}

init();
</script>
